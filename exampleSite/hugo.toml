baseURL = "https://example.org/"
title = "pixel-blog-hugo demo"
theme = "pixel-blog-hugo"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
enableRobotsTXT = true
hasCJKLanguage = true    # 中文按「字」统计，阅读时长/摘要才准确
summaryLength = 80

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 8

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false   # 图片渲染钩子输出 <figure>，避免被包进 <p>
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableofcontents]
    startLevel = 2
    endLevel = 4

# ── 示例站个性化（覆盖主题默认值；你重建自己的博客时写进自己的 hugo.toml）──
[params]
  author = "小稳"
  description = "pixel-blog-hugo 主题 · 示例站点"
  scanlines = true          # 示例站开启 CRT 扫描线（与上游设计一致）

  [params.identity]
    name = "小稳"
    logo = "images/logo.png"
    favicon = "images/logo.png"

  [params.hero]
    eyebrow = "示例站点 · 文案可随意修改"
    title = "小稳"
    tagline = "把折腾过的东西记录在这里。"
    intro = """
你好，这是 **pixel-blog-hugo** 主题的示例站点。

页面上的名字、标语、这段介绍，全都写在站点配置里，换成你自己的即可。

写文章、加项目，剩下的交给 Hugo。
"""

  [params.works]
    eyebrow = "FEATURED WORK"
    title = "个人作品"
    count = 3

  [params.techstack]
    enable = true
    title = "技术栈"
    subtitle = "示例分组，按需改成你自己的"
    [[params.techstack.groups]]
      title = "编程语言"
      icon = "language"
      description = "平时主要使用的语言。"
      items = ["Java", "TypeScript", "Go"]
    [[params.techstack.groups]]
      title = "后端与数据库"
      icon = "backend"
      description = "服务端与数据存储。"
      items = ["Spring Boot", "MySQL", "Redis"]
    [[params.techstack.groups]]
      title = "前端与工具"
      icon = "frontend"
      description = "界面开发与构建工具。"
      items = ["Vue.js", "Vite", "Hugo"]
    [[params.techstack.groups]]
      title = "运维与效率"
      icon = "devops"
      description = "部署与日常提效。"
      items = ["Linux", "Nginx", "Docker"]

  [params.assets]
    ogImage = "/images/og-default.png"   # 站点默认分享图（文章可用 cover 覆盖）

  # 社交图标：填了值的项才显示（首页 Hero 与页脚各一行），全部留空则不显示。
  # 内置图标（键名即下方字段名）：
  #   github  email  x  telegram  wechat  weibo  bilibili  zhihu
  #   juejin  youtube  linkedin  mastodon  discord  instagram  steam
  [params.social]
    # 只填你想展示的，多余的删掉或注释掉即可
    github = "https://github.com/LittleWin8"        # GitHub
    email = "hello@example.com"                     # 邮箱（自动加 mailto:）
    x = "https://x.com/LittleWin8"                  # X
    bilibili = "https://space.bilibili.com/1000000" # 哔哩哔哩
    steam = "https://steamcommunity.com/id/LittleWin8"  # Steam
    # telegram = "https://t.me/你的用户名"            # Telegram
    # wechat = "https://你的微信二维码图链接"          # 微信（通常放二维码图片链接）
    # weibo = "https://weibo.com/你的用户名"          # 微博
    # zhihu = "https://www.zhihu.com/people/你的ID"   # 知乎
    # juejin = "https://juejin.cn/user/你的ID"        # 掘金
    # youtube = "https://youtube.com/@你的频道"       # YouTube
    # linkedin = "https://linkedin.com/in/你的ID"     # LinkedIn
    # mastodon = "https://你的实例/@你的用户名"        # Mastodon
    # discord = "https://discord.gg/你的邀请码"       # Discord
    # instagram = "https://instagram.com/你的用户名"  # Instagram

  [params.links]
    title = "友情链接"
    description = "一些有趣的朋友和他们的站点，欢迎交换。"
    items = [
      { name = "Hugo", url = "https://gohugo.io/", description = "静态站点生成器" },
      { name = "GitHub", url = "https://github.com/", description = "代码托管平台" },
    ]

