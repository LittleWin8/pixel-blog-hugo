<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "zh-cn" }}">
<head>
  {{ partial "head/head.html" . }}
</head>
<body{{ if site.Params.scanlines }} class="scanlines"{{ end }}>
  <a class="skip-link" href="#main-content">{{ i18n "skipToContent" | default "跳到正文" }}</a>
  {{ partial "header.html" . }}
  <main id="main-content" class="site-main">
    <div class="container">
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  {{ partial "footer.html" . }}
  {{ partial "back-to-top.html" . }}
  <script>
    window.__COPY_I18N__ = {{ dict
      "copy" (i18n "copyCode" | default "复制")
      "copyLabel" (i18n "copyCodeLabel" | default "复制代码")
      "copied" (i18n "copied" | default "已复制")
      | jsonify | safeJS }};
  </script>
  {{ partial "scripts.html" . }}
</body>
</html>
