# pixel-blog-hugo 主题元信息（Hugo 主题库 / 用户识别用）
name = "pixel-blog-hugo"
description = "A pixel / 8-bit retro blog theme for Hugo: dark & light themes, two-column home, project showcase, built-in search, archive, tags and i18n."
homepage = "https://github.com/LittleWin8/pixel-blog-hugo"
demosite = "https://pixel-blog-hugo.pages.dev/"
tags = ["blog", "portfolio", "pixel", "retro", "dark", "responsive", "personal", "search"]
features = [
  "blog",
  "projects",
  "search",
  "tags",
  "archive",
  "table of contents",
  "dark mode",
  "i18n",
  "responsive",
  "seo",
  "json-ld",
  "opengraph",
  "rss",
  "code copy",
  "related posts",
]
min_version = "0.158.0"

license = "MIT"
licenselink = "https://github.com/LittleWin8/pixel-blog-hugo/blob/main/LICENSE"

[author]
  name = "LittleWin"
  homepage = "https://github.com/LittleWin8"
